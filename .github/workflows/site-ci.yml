name: Site CI

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/site-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/site-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-and-build:
    name: Site Lint, Test & Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'site/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build static site (Tailwind CSS v4 & Astro)
        run: npm run build

      - name: Run site validation tests
        run: npm test

      - name: Upload static build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist/
          retention-days: 7
