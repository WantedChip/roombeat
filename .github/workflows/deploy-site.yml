name: Deploy Landing Page to Cloudflare Pages

# ==============================================================================
# RoomBeat — Cloudflare Pages CI/CD Workflow Template
# Sub-phase: v0.9.3
#
# NOTE (RoomBeat Guidelines §2):
# Automated agents only create and maintain CI configuration templates;
# agents NEVER execute deployment commands or manage production secrets.
#
# Prerequisites for deployment:
# Configure the following repository secrets in GitHub Settings > Secrets and variables > Actions:
#   - CLOUDFLARE_API_TOKEN: Cloudflare API token with 'Cloudflare Pages: Edit' permissions
#   - CLOUDFLARE_ACCOUNT_ID: Cloudflare Account ID
# ==============================================================================

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run build validation only (do not publish to Cloudflare)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    name: Build & Deploy Static Site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'site/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build static site (Astro)
        run: npm run build

      - name: Validate build artifacts
        run: |
          echo "=== Validating build output in site/dist ==="
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html not found!"
            exit 1
          fi
          if [ ! -f "dist/_headers" ]; then
            echo "ERROR: dist/_headers edge configuration not found!"
            exit 1
          fi
          if [ ! -f "dist/robots.txt" ]; then
            echo "ERROR: dist/robots.txt not found!"
            exit 1
          fi
          if [ ! -f "dist/sitemap.xml" ]; then
            echo "ERROR: dist/sitemap.xml not found!"
            exit 1
          fi
          if [ ! -f "wrangler.toml" ]; then
            echo "ERROR: site/wrangler.toml configuration not found!"
            exit 1
          fi
          echo "✓ All static artifacts, security headers, and wrangler configs verified successfully."
          ls -lah dist/

      - name: Deploy to Cloudflare Pages
        if: ${{ !inputs.dry_run && env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'site'
          command: pages deploy dist --project-name=roombeat --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment Notice (When secrets not configured)
        if: ${{ !inputs.dry_run && env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::notice title=Deployment Skipped::Static build verified successfully. Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository secrets to enable automated deployment to Cloudflare Pages."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
