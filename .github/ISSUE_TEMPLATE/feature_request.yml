name: 💡 Feature Request
description: Propose an idea, capability enhancement, or architectural improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping evolve RoomBeat! Please make sure your proposal aligns with the core principles of zero cloud relay, local network isolation, and sub-10ms acoustic synchronization.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Feature
      description: Detailed description of what you want to happen and how it could work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've thought of.
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any mockups, flowcharts, or architecture diagrams here.
